    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.15), transparent 60%),

        }

        .card {
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3.5px solid #22c55e;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
            display: block;
        }

        .verified-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #2563eb;
            color: #ffffff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #0b0f19;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 22px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 12px 10px;
        }

        .stat-number {
            font-size: 17px;
            font-weight: 700;
            color: #22c55e;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
            font-weight: 600;
        }

        .timer-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px dashed rgba(239, 68, 68, 0.35);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 22px;
        }

        .timer-text {
            font-size: 13px;
            color: #fca5a5;
            font-weight: 600;
        }

        .timer-seconds {
            font-size: 15px;
            color: #ef4444;
            font-weight: 800;
        }

        .progress-bar-wrap {
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #22c55e);
            width: 100%;
            transition: width 1s linear;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 24px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 800;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.45);
            transition: all 0.25s ease;
            animation: pulse 2s infinite ease-in-out;
            letter-spacing: 0.4px;
        }

        .btn-telegram:active {
            transform: scale(0.98);
        }

        .btn-telegram svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
            }
            50% {
                box-shadow: 0 0 0 14px rgba(34, 197, 94, 0);
            }
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .shield-icon {
            color: #22c55e;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <img class="avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&auto=format&fit=crop&q=80" alt="Sahil Chaudhary">
            <div class="verified-badge">✓</div>
        </div>

        <h1 class="title">Sahil Chaudhary</h1>
        <p class="subtitle">Cricket Analyst & Match Prediction Expert</p>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-number">150K+</div>
                <div class="stat-label">Subscribers</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">95%+</div>
                <div class="stat-label">Accuracy Rate</div>
            </div>
        </div>

        <div class="timer-box">
            <div class="timer-text">
                Redirecting to Telegram in <span class="timer-seconds" id="timer">15</span>s...
            </div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress"></div>
            </div>
        </div>

        <a href="https://t.me/+ANIVKDsdC6ExMmU1" id="joinBtn" class="btn-telegram">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
            JOIN CHANNEL NOW (FREE)
        </a>

        <div class="footer-note">
            <span class="shield-icon">✔</span> 100% Free Entry • Verified Public Channel
        </div>
    </div>

    <script>
        const targetUrl = "https://t.me/+ANIVKDsdC6ExMmU1";
        let timeLeft = 15;
        const totalTime = 15;
        const timerElement = document.getElementById("timer");
        const progressElement = document.getElementById("progress");
        const joinBtn = document.getElementById("joinBtn");

        function trackAndRedirect() {
            if (typeof fbq === 'function') {
                fbq('track', 'Lead');
            }
            window.location.href = targetUrl;
        }

        joinBtn.addEventListener('click', function(e) {
            e.preventDefault();
            trackAndRedirect();
        });

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                timerElement.innerText = timeLeft;
                progressElement.style.width = ((timeLeft / totalTime) * 100) + "%";
            }
            if (timeLeft <= 0) {
                clearInterval(countdown);
                trackAndRedirect();
            }
        }, 1000);
    </script>
